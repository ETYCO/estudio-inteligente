:root{--bg:#FBF5E9;--card:#fff;--ink:#1d1a17;--mut:#7a6f62;--line:#eadfcb;--red:#D7191F;--gold:#E5A611;--acc:#D7191F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:90px}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
.strip{height:6px;background:var(--acc)}
header{display:flex;align-items:center;gap:14px;padding:14px 0 8px}
header img{width:78px;height:78px;border-radius:50%;object-fit:cover;object-position:50% 38%;flex:none;box-shadow:0 0 0 3px var(--gold)}
.brand{font-family:Osw,"Arial Narrow",Impact,sans-serif;font-weight:600;letter-spacing:.06em;color:var(--gold);font-size:clamp(28px,7vw,40px);line-height:1;margin:0}
.meta{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.35}
.lbadge{display:inline-block;background:var(--acc);color:#fff;font-family:Osw,"Arial Narrow",sans-serif;font-weight:600;letter-spacing:.08em;border-radius:6px;padding:2px 9px;font-size:14px;margin-left:6px;vertical-align:4px}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:8px 0;background:var(--bg)}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;font-weight:700;cursor:pointer;font-size:14px}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;margin-left:4px}
.search{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;margin:4px 0 8px}
.search:focus{border-color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1d1a17}
h2{font-family:Osw,"Arial Narrow",Impact,sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--red);font-size:20px;margin:18px 0 6px;display:flex;align-items:center;gap:10px}
h2:after{content:"";flex:1;height:2px;background:var(--gold);opacity:.5}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:6px}
.it.in{border-color:var(--gold);background:#fffaf0}
.it .nf{flex:1;min-width:0}
.it .nm{font-weight:700;font-size:15px;line-height:1.2}
.it .cd{font-size:12px;color:var(--mut);margin-top:2px}
.it .pr{font-weight:800;font-size:16px;white-space:nowrap}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;flex:none}
.step button{width:36px;height:38px;border:0;background:transparent;font-size:20px;cursor:pointer;font-weight:700}
.step button.p{background:var(--gold)}
.step input{width:42px;text-align:center;border:0;height:38px;font-weight:800;outline:none;background:transparent;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.empty{color:var(--mut);text-align:center;padding:36px 0}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.pl{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.pl .nf{flex:1;min-width:0}.pl .nm{font-weight:700;font-size:14px}.pl .cd{font-size:12px;color:var(--mut)}
.pl .st{font-weight:800;min-width:84px;text-align:right}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;padding:12px 0 4px}
.tot span:last-child{color:var(--red)}
.fld{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0 0;outline:none}
textarea.fld{min-height:60px;resize:vertical}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);font-size:15px}
.btn.big{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--ink);height:54px;font-size:17px}
.btn.wa{background:#25D366;border-color:#25D366;color:#06260f}
.btn.sv{background:var(--gold);border-color:var(--gold)}
.msg{font-size:14px;color:#1F6E43;font-weight:700;min-height:20px;margin-top:8px;text-align:center}
.raw{width:100%;min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:13px;margin-top:8px}
.sv-it{border-bottom:1px solid var(--line);padding:12px 0}
.sv-it .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.sv-it .s{font-size:13px;color:var(--mut);margin:2px 0 8px}
.sv-it .a{display:flex;gap:6px;flex-wrap:wrap}
.sv-it .a button{flex:1 1 90px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-size:13px}
.sv-it.sent .h:after{content:"✔ enviado";color:#1F6E43;font-size:12px}
.leg{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:800;box-shadow:0 8px 24px -6px rgba(0,0,0,.45);cursor:pointer;display:none;white-space:nowrap;font-size:15px}
.fab.v{display:block}
.net{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}
.net.on{background:#e3f4ea;color:#1F6E43}.net.off{background:#fde7e7;color:#a11}
footer{text-align:center;color:var(--mut);font-size:12px;margin:30px 0 10px;line-height:1.6}
footer button{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:12px}
[hidden]{display:none!important}
@media(max-width:420px){.it{flex-wrap:wrap}.it .nf{flex:1 1 100%}.it .pr{flex:1}}
</style>
</head>

const L='A', P=[{"c": "Migas", "k": "701020", "n": "Carlitos - Elegidas", "p": 16500}, {"c": "Migas", "k": "701030", "n": "Pan de Miga x 100 L.E.", "p": 15200}, {"c": "Migas", "k": "701050", "n": "Pan de Miga x 50 L.E.", "p": 8200}, {"c": "Migas", "k": "701070", "n": "Pan de Miga x 20 L.E.", "p": 3600}, {"c": "Migas", "k": "702020", "n": "Galletas de miel L.E.", "p": 3500}, {"c": "Panificación", "k": "803010", "n": "Panchos x 6 L.E.", "p": 1600}, {"c": "Panificación", "k": "803050", "n": "Hamburguesas x 4 L.E.", "p": 1600}, {"c": "Panificación", "k": "804010", "n": "Pan Lácteo L.E.", "p": 2300}, {"c": "Panificación", "k": "804070", "n": "Pan Doble Salvado L.E.", "p": 2500}, {"c": "Panificación", "k": "804090", "n": "Pan Multisemilla", "p": 2800}, {"c": "Panificación", "k": "804091", "n": "Pan Lactal Familiar", "p": 3000}, {"c": "Panificación", "k": "804092", "n": "Pan Salvado Familiar", "p": 3200}, {"c": "Masas", "k": "806010", "n": "Masas p/empanadas L.E.", "p": 1500}, {"c": "Masas", "k": "806020", "n": "Masas Pascualinas L.E.", "p": 1600}, {"c": "Masas", "k": "806030", "n": "Masas Emp. Hojaldre M.P.", "p": 1400}, {"c": "Masas", "k": "806040", "n": "Masas Pascualinas M.P.", "p": 1500}, {"c": "Masas", "k": "806050", "n": "Masas Emp. Copetín M.P.", "p": 1600}, {"c": "Masas", "k": "806060", "n": "Masas Pasteles M.P.", "p": 1600}, {"c": "Masas", "k": "806070", "n": "Masas Emp. Criollas M.P.", "p": 1400}, {"c": "Masas", "k": "807010", "n": "Fideos L.E.", "p": 2000}, {"c": "Pastas La Española", "k": "931000", "n": "Ravioles ricota x 500 g", "p": 3100}, {"c": "Pastas La Española", "k": "931000", "n": "Ravioles 4 quesos x 500 g", "p": 3100}, {"c": "Pastas La Española", "k": "931000", "n": "Ravioles verdura/pollo x 500 g", "p": 3100}, {"c": "Pastas La Española", "k": "931000", "n": "Ravioles verdura/carne x 500 g", "p": 3100}, {"c": "Pastas La Española", "k": "931000", "n": "Capelletis 4 quesos x 500 g", "p": 3100}, {"c": "Pastas La Española", "k": "931000", "n": "Capelletis verdura/carne x 500 g", "p": 3100}, {"c": "Pastas La Española", "k": "931017", "n": "Ñoquis", "p": 2600}, {"c": "Pan dulce", "k": "808050", "n": "Pan dulce x 400 L.E.", "p": 2700}, {"c": "Pan dulce", "k": "808059", "n": "Pan dulce x 400 L.E. s/fruta", "p": 2700}, {"c": "Pan dulce", "k": "808060", "n": "Pan dulce x 400 L.E. c/chips", "p": 2700}, {"c": "Berben", "k": "925010", "n": "Vainilla x 2 kg", "p": 13000}, {"c": "Berben", "k": "926010", "n": "Tostadas x 1 kg", "p": 6000}, {"c": "Tacos Jalisqueños", "k": "", "n": "Tacos x 12", "p": 3000}, {"c": "Tacos Jalisqueños", "k": "", "n": "Tacos x 6", "p": 1800}, {"c": "Tacos Jalisqueños", "k": "", "n": "Tacos salvado x 6", "p": 1800}, {"c": "Alfajores", "k": "", "n": "Alfajores glaseados x 12", "p": 6000}], CATS=[...new Set(P.map(p=>p.c))];
const K='le_'+L+'_', $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(K+k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let cart=ld('cart',{}),saved=ld('saved',[]),cat='';
for(const k in cart)if(!P[k])delete cart[k];
const fm=v=>'$ '+Math.round(v).toLocaleString('es-AR');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const today=()=>{const d=new Date();return d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})};
const total=()=>Object.entries(cart).reduce((a,[i,q])=>a+P[i].p*q,0);
const units=()=>Object.values(cart).reduce((a,q)=>a+q,0);

function chips(){$('#chips').innerHTML=[['','Todos'],...CATS.map(c=>[c,c])].map(([v,l])=>`<button class="chip" data-c="${v}" aria-pressed="${v===cat}">${l}</button>`).join('')}
const stepper=(i,q)=>`<div class="step" data-i="${i}"><button data-d="-1">−</button><input inputmode="numeric" value="${q||''}" placeholder="0"><button class="p" data-d="1">+</button></div>`;
function list(){
  const t=norm($('#q').value.trim());let h='',last='';
  P.forEach((p,i)=>{
    if(cat&&p.c!==cat)return;
    if(t&&!norm(p.n+' '+p.k+' '+p.c).includes(t))return;
    if(p.c!==last){h+=`<h2>${p.c}</h2>`;last=p.c}
    h+=`<div class="it${cart[i]?' in':''}"><div class="nf"><div class="nm">${p.n}</div><div class="cd">${p.k?'Cód. '+p.k:'Sin código'}</div></div><div class="pr">${fm(p.p)}</div>${stepper(i,cart[i])}</div>`;
  });
  $('#list').innerHTML=h||'<div class="empty">No se encontró ningún producto.</div>';
}
function setQ(i,q){q=Math.max(0,Math.min(9999,parseInt(q)||0));if(q)cart[i]=q;else delete cart[i];sv('cart',cart);badges()}
function badges(){
  const n=Object.keys(cart).length;$('#cnt').textContent=n;$('#scnt').textContent=saved.filter(s=>!s.sent).length;$('#cnt').hidden=!n;$('#scnt').hidden=!+$('#scnt').textContent;
  const f=$('#fab');f.textContent=`Ver pedido · ${n} prod. · ${fm(total())}`;f.classList.toggle('v',n>0&&$('#cat').hidden===false);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.step button');if(!b)return;
  const st=b.closest('.step'),i=st.dataset.i,inp=st.querySelector('input');
  const q=Math.max(0,(parseInt(inp.value)||0)+ +b.dataset.d);inp.value=q||'';setQ(i,q);
  const row=st.closest('.it');if(row)row.classList.toggle('in',q>0);
  if(!$('#ped').hidden)ped();
});
document.addEventListener('change',e=>{
  const st=e.target.closest('.step');if(!st)return;setQ(st.dataset.i,e.target.value);
  if(!$('#ped').hidden)ped();else list();
});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;chips();list()});
$('#q').addEventListener('input',list);

function text(c=cart,cli=$('#cli').value.trim(),nota=$('#nota').value.trim(),fecha=today()){
  let t=`*PEDIDO LA ESPAÑOLA* (L-${L})\n`;
  if(cli)t+=`Cliente: ${cli}\n`;t+=`Fecha: ${fecha}\n\n`;let tot=0;
  Object.entries(c).forEach(([i,q])=>{const p=P[i],s=p.p*q;tot+=s;t+=`• ${q} x ${p.n}${p.k?' ('+p.k+')':''} — ${fm(p.p)} = ${fm(s)}\n`});
  t+=`\n*TOTAL: ${fm(tot)}* (IVA incluido)`;if(nota)t+=`\nNota: ${nota}`;return t;
}
function ped(){
  const e=Object.entries(cart);
  $('#plines').innerHTML=e.length?e.map(([i,q])=>{const p=P[i];return `<div class="pl"><div class="nf"><div class="nm">${p.n}</div><div class="cd">${fm(p.p)} c/u</div></div>${stepper(i,q)}<div class="st">${fm(p.p*q)}</div></div>`}).join(''):'<div class="empty">Todavía no cargaste productos.<br>Volvé al Catálogo y usá + / −.</div>';
  $('#tot').innerHTML=e.length?`<div class="tot"><span>Total (${units()} u)</span><span>${fm(total())}</span></div>`:'';
  waLink();
}
const isMob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const waURL=t=>(isMob?'whatsapp://send?text=':'https://wa.me/?text=')+encodeURIComponent(t);
function waLink(){$('#wa').href=waURL(text())}
function flash(m){$('#msg').textContent=m;clearTimeout(flash.t);flash.t=setTimeout(()=>$('#msg').textContent='',3500)}
async function copy(t){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);const ok=document.execCommand('copy');a.remove();if(ok)return true}catch(e){}
  return false;
}
async function doCopy(t,raw){
  if(await copy(t)){flash('✔ Texto copiado. Pegalo en WhatsApp o donde quieras.');raw.hidden=true}
  else{raw.value=t;raw.hidden=false;raw.focus();raw.select();flash('Mantené apretado el texto de abajo y elegí Copiar.')}
}
$('#cp').onclick=()=>{if(!Object.keys(cart).length)return flash('El pedido está vacío.');doCopy(text(),$('#raw'))};
$('#wa').onclick=e=>{if(!Object.keys(cart).length){e.preventDefault();flash('El pedido está vacío.')}else $('#wa').href=waURL(text())};
$('#sh').onclick=async()=>{if(!Object.keys(cart).length)return flash('El pedido está vacío.');const t=text();
  if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else doCopy(t,$('#raw'))};
$('#gd').onclick=()=>{if(!Object.keys(cart).length)return flash('El pedido está vacío.');
  const f=today(),cli=$('#cli').value.trim(),nota=$('#nota').value.trim();
  saved.unshift({id:Date.now(),cli,fecha:f,t:text(cart,cli,nota,f),tot:total(),n:Object.keys(cart).length,sent:false});sv('saved',saved);
  cart={};sv('cart',cart);$('#cli').value='';$('#nota').value='';ped();list();badges();flash('💾 Pedido guardado. Podés cargar el siguiente.')};
$('#clr').onclick=()=>{if(!Object.keys(cart).length||confirm('¿Vaciar el pedido actual?')){cart={};sv('cart',cart);ped();list();badges()}};

function sav(){
  $('#slist').innerHTML=saved.length?saved.map(s=>`<div class="sv-it${s.sent?' sent':''}" data-id="${s.id}"><div class="h"><span>${s.cli||'Sin nombre'}</span><span>${fm(s.tot)}</span></div><div class="s">${s.fecha} · ${s.n} productos</div><div class="a"><button data-a="cp">📋 Copiar</button><button data-a="wa">WhatsApp</button><button data-a="ok">${s.sent?'Desmarcar':'✔ Enviado'}</button><button data-a="del">Borrar</button></div><textarea class="raw" readonly hidden></textarea></div>`).join(''):'<div class="empty">No hay pedidos guardados.</div>';
}
$('#slist').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;const el=b.closest('.sv-it'),s=saved.find(x=>x.id==el.dataset.id);if(!s)return;
  const a=b.dataset.a;
  if(a==='cp'){copy(s.t).then(ok=>{const r=el.querySelector('.raw');if(ok){b.textContent='✔ Copiado';setTimeout(()=>b.textContent='📋 Copiar',2000)}else{r.value=s.t;r.hidden=false;r.select()}})}
  if(a==='wa'){location.href=waURL(s.t)}
  if(a==='ok'){s.sent=!s.sent;sv('saved',saved);sav();badges()}
  if(a==='del'&&confirm('¿Borrar este pedido guardado?')){saved=saved.filter(x=>x!==s);sv('saved',saved);sav();badges()}
});
$('#fx').onclick=()=>{if(saved.length&&confirm('¿Borrar TODOS los pedidos guardados de la Lista '+L+'?')){saved=[];sv('saved',saved);sav();badges()}};

function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));['cat','ped','sav'].forEach(s=>$('#'+s).hidden=s!==t);
  if(t==='ped')ped();if(t==='sav')sav();if(t==='cat')list();badges();scrollTo(0,0)}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)});
$('#fab').onclick=()=>tab('ped');
['cli','nota'].forEach(id=>$('#'+id).addEventListener('input',waLink));
function net(){const o=navigator.onLine;$('#net').innerHTML=`<span class="net ${o?'on':'off'}">${o?'● Con conexión':'● Sin conexión — funciona igual'}</span>`}
addEventListener('online',net);addEventListener('offline',net);net();
chips();list();badges();
if('serviceWorker' in navigator&&location.protocol==='https:'&&true)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
