const $=s=>document.querySelector(s);const fmt=n=>'$ '+n.toLocaleString('es-AR');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
D.forEach(x=>x.k=norm(x.n+' '+x.c+' '+x.r+' '+x.s));
let cart={};try{cart=JSON.parse(localStorage.getItem('dolce-pres')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('dolce-pres',JSON.stringify(cart))}catch(e){}};
[...new Set(D.map(x=>x.r))].forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;$('#rub').append(o)});
function list(){const q=norm($('#q').value.trim());const r=$('#rub').value;const ws=q.split(/\s+/).filter(Boolean);
 const res=D.filter(x=>(!r||x.r==r)&&ws.every(w=>x.k.includes(w))).slice(0,150);
 $('#list').innerHTML=res.length?res.map(x=>`<div class="item"><div class="t"><b>${x.n}</b><small>${x.r} · ${x.s} · ${x.c}</small></div><div class="pr"><div class="l">${fmt(x.l)}</div><div class="e">Efvo ${fmt(x.e)}</div></div><button class="add${cart[x.c]?' on':''}" data-c="${x.c}">${cart[x.c]?'✓':'+'}</button></div>`).join(''):'<div class="empty">No encontré nada. Probá con otra palabra.</div>';}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.add');if(!b)return;const c=b.dataset.c;cart[c]=(cart[c]||0)+1;save();b.classList.add('on');b.textContent='✓';upd()});
function fp(){return document.querySelector('input[name=fp]:checked').value}
function lines(){return Object.entries(cart).filter(([c,q])=>q>0).map(([c,q])=>{const x=D.find(y=>y.c==c);return x?{x,q,p:x[fp()]}:null}).filter(Boolean)}
function texto(){const L=lines();const tot=L.reduce((a,l)=>a+l.p*l.q,0);const cli=$('#cli').value.trim();const f=new Date().toLocaleDateString('es-AR');
 let t='*DOLCE FESTA · Presupuesto* 🎉\n'+f+(cli?'\nCliente: '+cli:'')+'\n\n';L.forEach(l=>t+=`${l.q} x ${l.x.n} — ${fmt(l.p)} = ${fmt(l.p*l.q)}\n`);
 t+=`\n*TOTAL ${fmt(tot)}* (${fp()=='e'?'precio efectivo':'precio de lista: tarjeta, MP o transferencia'})\n\nLa factura te la enviamos a la brevedad. ¡Gracias por elegirnos! 💖\nInstagram @dolcefesta_cotillon`;return t}
function upd(){const L=lines();$('#cnt').textContent=L.reduce((a,l)=>a+l.q,0);
 $('#cart').innerHTML=L.length?L.map(l=>`<div class="item"><div class="t"><b>${l.x.n}</b><small>${fmt(l.p)} c/u</small></div><div class="q"><button data-c="${l.x.c}" data-d="-1">−</button><span>${l.q}</span><button data-c="${l.x.c}" data-d="1">+</button></div><div class="pr"><div class="l">${fmt(l.p*l.q)}</div></div></div>`).join(''):'<div class="empty">Todavía no agregaste productos. Buscalos y tocá +.</div>';
 const tot=L.reduce((a,l)=>a+l.p*l.q,0),tl=L.reduce((a,l)=>a+l.x.l*l.q,0),te=L.reduce((a,l)=>a+l.x.e*l.q,0);
 $('#tot').innerHTML=`<div>Total ${fp()=='e'?'en efectivo':'con tarjeta / MP / transferencia'}</div><div class="big">${fmt(tot)}</div><small>Efectivo ${fmt(te)} · Lista ${fmt(tl)}</small>`;
 $('#wa').href='https://wa.me/?text='+encodeURIComponent(texto());}
$('#cart').addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(!b)return;const c=b.dataset.c;cart[c]=Math.max(0,(cart[c]||0)+ +b.dataset.d);if(!cart[c])delete cart[c];save();upd();list()});
document.querySelectorAll('input[name=fp]').forEach(r=>r.addEventListener('change',upd));$('#cli').addEventListener('input',upd);
$('#copy').addEventListener('click',async()=>{const t=texto();let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{ok=document.execCommand('copy')}catch(_){}a.remove()}$('#msg').textContent=ok?'✔ Copiado: pegalo en el chat del cliente.':'No se pudo copiar.'});
$('#clr').addEventListener('click',()=>{cart={};save();$('#cli').value='';upd();list();$('#msg').textContent=''});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x==b));$('#buscar').hidden=b.dataset.t!='buscar';$('#pres').hidden=b.dataset.t!='pres';scrollTo(0,0)}));
$('#q').addEventListener('input',list);$('#rub').addEventListener('change',list);list();upd();
